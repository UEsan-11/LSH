/* 主分類對應 CSS class */
const TYPE_CLASS = {
  電視劇: "type-drama",
  電影: "type-film",
  活動: "type-event",
  獲獎: "type-event",
  兵役: "type-event",
  經紀: "type-event",
  綜藝: "type-event",
  主持: "type-event",
  廣播劇: "type-event",
  音樂錄影帶: "type-event",
  時裝秀: "type-show",
};

/* 哪些 type 屬於「活動」大分類 */
const EVENT_TYPES = new Set([
  '活動', '獲獎', '兵役', '經紀', '綜藝', '主持', '廣播劇', '音樂錄影帶'
]);

let currentFilter = "全部";
let currentSubFilter = "全部";

function setFilter(f, btn) {
  currentFilter = f;
  currentSubFilter = "全部";
  document.querySelectorAll('.filter-btn').forEach(function(b) { b.className = 'filter-btn'; });
  var cls = f === "全部" ? "active-all"
    : f === "電視劇" ? "active-drama"
    : f === "電影"   ? "active-film"
    : f === "時裝秀" ? "active-show"
    : "active-event";
  btn.classList.add(cls);

  var sub = document.getElementById('subFilters');
  if (f === "活動") {
    sub.style.display = 'flex';
    sub.querySelectorAll('.sub-btn').forEach(function(b) { b.classList.remove('active'); });
    sub.querySelectorAll('.sub-btn')[0].classList.add('active');
  } else {
    sub.style.display = 'none';
  }
  render();
}

function setSubFilter(f, btn) {
  currentSubFilter = f;
  document.querySelectorAll('.sub-btn').forEach(function(b) { b.classList.remove('active'); });
  btn.classList.add('active');
  render();
}

function matchesFilter(w) {
  if (currentFilter === "全部") return true;
  if (currentFilter === "時裝秀") return w.type === "時裝秀";
  if (currentFilter === "電視劇") return w.type === "電視劇";
  if (currentFilter === "電影")   return w.type === "電影";
  /* 活動大分類 */
  if (!EVENT_TYPES.has(w.type)) return false;
  if (currentSubFilter === "全部") return true;
  var subKey = currentSubFilter;
  if (['綜藝', '主持', '廣播劇', '獲獎', '兵役', '經紀'].includes(subKey)) return w.type === subKey;
  if (subKey === '팬미팅')  return w.tags.some(function(t) { return ['팬미팅', 'Fan Meeting'].includes(t); });
  if (subKey === '生咖')    return w.tags.some(function(t) { return ['생카', '生日咖啡廳'].includes(t); });
  if (subKey === 'MV')      return w.tags.includes('MV') || w.type === '音樂錄影帶';
  if (subKey === '品牌活動') return w.tags.some(function(t) { return ['時尚', '代言', '品牌', '品牌活動'].includes(t); });
  return false;
}

function render() {
  var filtered = works.filter(matchesFilter);
  var grouped = {};
  filtered.forEach(function(w) {
    if (!grouped[w.year]) grouped[w.year] = [];
    grouped[w.year].push(w);
  });

  Object.keys(grouped).forEach(function(year) {
    grouped[year].sort(function(a, b) {
      var ma = a.month ? parseInt(a.month.split('/')[0]) * 100 + parseInt(a.month.split('/')[1]) : 0;
      var mb = b.month ? parseInt(b.month.split('/')[0]) * 100 + parseInt(b.month.split('/')[1]) : 0;
      return ma - mb;
    });
  });

  var years = Object.keys(grouped).sort(function(a, b) { return +a - +b; });
  var tl = document.getElementById('timeline');
  tl.innerHTML = '';

  if (!years.length) {
    tl.innerHTML = '<div style="text-align:center;padding:60px 0;color:rgba(240,232,208,0.28);font-size:13px;letter-spacing:0.2em;">— 暫無資料 —</div>';
    return;
  }

  years.forEach(function(year) {
    var group = document.createElement('div');
    group.className = 'year-group';

    var hdr = document.createElement('div');
    hdr.className = 'year-header';
    hdr.innerHTML = '<div class="year-label">' + year + '</div><div class="year-dot"></div>';
    group.appendChild(hdr);

    var col = document.createElement('div');
    col.className = 'items-col';

    grouped[year].forEach(function(item) {
      var tc = TYPE_CLASS[item.type] || 'type-event';

      var monthHtml = item.month
        ? '<span class="card-month">' + item.month + '</span>'
        : '';

      var altParts = [];
      if (item.title_kr) altParts.push(item.title_kr);
      if (item.title_en) altParts.push(item.title_en);
      var altHtml = altParts.length
        ? '<div class="card-alt">' + altParts.join(' · ') + '</div>'
        : '';

      var roleHtml = item.role
        ? '<div class="card-role">&#9658; ' + item.role + '</div>'
        : '';

      var tagsHtml = '';
      if (item.tags && item.tags.length) {
        var tagSpans = item.tags.map(function(t) {
          return '<span class="tag">#' + t + '</span>';
        }).join('');
        tagsHtml = '<div class="card-tags">' + tagSpans + '</div>';
      }

      var thumbHtml = (item.img && (item.type === '電視劇' || item.type === '電影'))
        ? '<div class="card-thumb"><img src="' + item.img + '" alt="' + item.title + '" loading="lazy"/></div>'
        : '';

      var card = document.createElement('div');
      card.className = 'work-card ' + tc;
      card.innerHTML =
        '<div class="card-top">' +
        thumbHtml +
        '<div style="flex:1;min-width:0;">' +
        '<span class="type-badge ' + tc + '">' + item.type + '</span>' +
        '<div class="card-body">' +
        '<div class="card-title">' + monthHtml + item.title + '</div>' +
        altHtml +
        roleHtml +
        '<div class="card-desc">' + item.desc + '</div>' +
        tagsHtml +
        '</div>' +
        '</div>' +
        '</div>';

      col.appendChild(card);
    });

    group.appendChild(col);
    tl.appendChild(group);
  });
}

render();

/* ── i18n ── */
var i18n = {
  zh: {
    'page-title': '作品年表',
    'page-range': '2006 — 2026',
    'tl-end': '∞ 持續更新中',
  },
  en: {
    'page-title': 'Filmography',
    'page-range': '2006 — 2026',
    'tl-end': '∞ Continuously updated',
  },
  ko: {
    'page-title': '작품 연보',
    'page-range': '2006 — 2026',
    'tl-end': '∞ 계속 업데이트 중',
  },
};

function setLang(lang) {
  var labels = { zh: '繁中', en: 'EN', ko: '한국어' };
  document.getElementById('langLabel').textContent = labels[lang] || lang;
  var dict = Object.assign({}, i18n.zh, i18n[lang] || {});
  document.querySelectorAll('[data-i18n]').forEach(function(el) {
    var key = el.dataset.i18n;
    if (dict[key] !== undefined) el.innerHTML = dict[key];
  });
}

function toggleLangMenu() {
  document.getElementById('langMenu').classList.toggle('open');
}

document.addEventListener('click', function(e) {
  var dd = document.getElementById('langDropdown');
  if (dd && !dd.contains(e.target)) {
    document.getElementById('langMenu').classList.remove('open');
  }
});

/* ── 回到頂部 ── */
window.addEventListener('scroll', function() {
  var btn = document.getElementById('backToTop');
  if (btn) btn.classList.toggle('visible', window.scrollY > 300);
});
</script>
