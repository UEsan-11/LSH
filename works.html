      { year: 2025, title: "《S LINE》", title_kr: "S라인", title_en: "S LINE", type: "電視劇", role: "韓志昱 / 한지욱 / Han Ji-wook", desc: "黑暗奇幻題材，話題度很高。", tags: ["黑暗奇幻", "話題", "主演"] },
      { year: 2025, month: "11/21", title: "杭州粉絲見面會", title_kr: "항저우 팬미팅", title_en: "Hangzhou Fan Meeting", type: "活動", desc: "時隔10年的官方粉絲見面會 #1。", tags: ["팬미팅", "Fan Meeting"] },

      { year: 2026, month: "01/28", title: "《Sister》", title_kr: "시스터", title_en: "Sister", type: "電影", role: "未公開", desc: "黑暗犯罪題材，挑戰全新反派形象。", tags: ["犯罪", "反派"] },
      { year: 2026, title: "《訂閱男友》", title_kr: "구독남친", title_en: "Monthly Boyfriend", type: "電視劇", role: "崔時宇 / 최시우", desc: "Netflix 特別出演。", tags: ["Netflix", "特別出演"] },
      { year: 2026, title: "《銀河大酒店》", title_kr: "은하수 호텔", title_en: "Galaxy Hotel", type: "電視劇", role: "白基 / 백기", desc: "Netflix 待播作品。", tags: ["Netflix", "待播", "主演"] },
      { year: 2026, title: "《女皇的後宮們》", title_kr: "여왕의 후궁들", title_en: "The Queen's Court", type: "電視劇", role: "未公開", desc: "tvN 待播作品。", tags: ["待播", "主演"] },
      { year: 2026, title: "《Dealer》", title_kr: "딜러", title_en: "Dealer", type: "電視劇", role: "趙俊 / 조준", desc: "Netflix 待播作品。", tags: ["Netflix", "待播", "主演"] },
      { year: 2026, month: "05/30", title: "上海粉絲見面會", title_kr: "상하이 팬미팅", title_en: "Shanghai Fan Meeting", type: "活動", desc: "官方粉絲見面會 #2。", tags: ["팬미팅", "Fan Meeting"] },
      { year: 2026, month: "05/31", title: "弘大生日咖啡廳", title_kr: "홍대 생일카페", title_en: "Hongdae Birthday Cafe Event", type: "活動", desc: "韓國粉絲小型慶生活動。", tags: ["생카", "生日咖啡廳"] },
    ];

    /* 主分類對應 CSS class */
    const TYPE_CLASS = {
      電視劇:    "type-drama",
      電影:      "type-film",
      活動:      "type-event",
      獲獎:      "type-event",
      兵役:      "type-event",
      經紀公司:  "type-event",
      綜藝:      "type-event",
      主持:      "type-event",
      廣播劇:    "type-event",
      音樂錄影帶:"type-event",
      時裝秀:    "type-show",
    };

    /* 哪些 type 屬於「活動」大分類 */
    const EVENT_TYPES = new Set([
      '活動','獲獎','兵役','經紀公司','綜藝','主持','廣播劇','音樂錄影帶'
    ]);

    /* 子分類 tag → 主要 type 對應 */
    const SUBTAG_MAP = {
      '팬미팅': ['팬미팅','Fan Meeting'],
      '生咖':   ['생카','生日咖啡廳'],
      '綜藝':   null,  // 直接比對 type
      '主持':   null,
      'MV':     ['MV'],
      '廣播劇': null,
      '獲獎':   null,
      '經紀公司':null,
      '兵役':   null,
      '品牌活動':['時尚','代言'],
    };

    let currentFilter    = "全部";
    let currentSubFilter = "全部";

    function setFilter(f, btn) {
      currentFilter    = f;
      currentSubFilter = "全部";
      document.querySelectorAll('.filter-btn').forEach(b => b.className = 'filter-btn');
      const cls = f === "全部"   ? "active-all"
                : f === "電視劇" ? "active-drama"
                : f === "電影"   ? "active-film"
                : f === "時裝秀" ? "active-show"
                :                  "active-event";
      btn.classList.add(cls);

      /* 顯示/隱藏子分類列 */
      const sub = document.getElementById('subFilters');
      if (f === "活動") {
        sub.style.display = 'flex';
        sub.querySelectorAll('.sub-btn').forEach(b => b.classList.remove('active'));
        sub.querySelectorAll('.sub-btn')[0].classList.add('active');
      } else {
        sub.style.display = 'none';
      }
      render();
    }

    function setSubFilter(f, btn) {
      currentSubFilter = f;
      document.querySelectorAll('.sub-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      render();
    }

    function matchesFilter(w) {
      if (currentFilter === "全部") return true;
      if (currentFilter === "時裝秀") return w.type === "時裝秀";
      if (currentFilter === "電視劇") return w.type === "電視劇";
      if (currentFilter === "電影")   return w.type === "電影";
      /* 活動大分類 */
      if (!EVENT_TYPES.has(w.type)) return false;
      if (currentSubFilter === "全部") return true;
      /* 子分類比對 */
      const subKey = currentSubFilter;
      /* type 直接對應的子分類 */
      if (['綜藝','主持','廣播劇','獲獎','兵役','經紀公司'].includes(subKey)) {
        return w.type === subKey;
      }
      /* tag 對應的子分類 */
      if (subKey === '팬미팅') return w.tags.some(t => ['팬미팅','Fan Meeting'].includes(t));
      if (subKey === '生咖')   return w.tags.some(t => ['생카','生日咖啡廳'].includes(t));
      if (subKey === 'MV')     return w.tags.includes('MV') || w.type === '音樂錄影帶';
      if (subKey === '品牌活動') return w.tags.some(t => ['時尚','代言','品牌'].includes(t));
      return false;
    }

    function render() {
      const filtered = works.filter(matchesFilter);
      const grouped  = {};
      filtered.forEach(w => {
        if (!grouped[w.year]) grouped[w.year] = [];
        grouped[w.year].push(w);
      });

      const years = Object.keys(grouped).sort((a, b) => +a - +b);
      const tl = document.getElementById('timeline');
      tl.innerHTML = '';

      if (!years.length) {
        tl.innerHTML = '<div style="text-align:center;padding:60px 0;color:rgba(240,232,208,0.28);font-size:13px;letter-spacing:0.2em;">— 暫無資料 —</div>';
        return;
      }

      years.forEach(year => {
        const group = document.createElement('div');
        group.className = 'year-group';

        const hdr = document.createElement('div');
        hdr.className = 'year-header';
        hdr.innerHTML = `<div class="year-label">${year}</div><div class="year-dot"></div>`;
        group.appendChild(hdr);

        const col = document.createElement('div');
        col.className = 'items-col';

        grouped[year].forEach(item => {
          const tc = TYPE_CLASS[item.type] || 'type-event';
          const monthHtml = item.month
            ? `<span class="card-month">${item.month}</span>` : '';
          const altHtml = (item.title_kr || item.title_en)
            ? `<div class="card-alt">${[item.title_kr, item.title_en].filter(Boolean).join(' · ')}</div>` : '';
          const roleHtml = item.role
            ? `<div class="card-role">▸ ${item.role}</div>` : '';
          const tagsHtml = item.tags.length
            ? `<div class="card-tags">${item.tags.map(t => `<span class="tag">#${t}</span>`).join('')}</div>` : '';

          const card = document.createElement('div');
          card.className = `work-card ${tc}`;
          card.innerHTML = `
            <div class="card-top">
              <span class="type-badge ${tc}">${item.type}</span>
              <div class="card-body">
                <div class="card-title">${monthHtml}${item.title}</div>
                ${altHtml}
                ${roleHtml}
                <div class="card-desc">${item.desc}</div>
                ${tagsHtml}
              </div>
            </div>`;
          col.appendChild(card);
        });

        group.appendChild(col);
        tl.appendChild(group);
      });
    }

    render();
  </script>
