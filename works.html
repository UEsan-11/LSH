<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>作品年表 · 이수혁 Lee Soo Hyuk</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;600&family=Noto+Serif+TC:wght@300;400&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0a0a0f;
      --bg2:      #111118;
      --bg3:      #18181f;
      --gold:     #e2c97e;
      --gold-dim: rgba(226,201,126,0.18);
      --gold-line:rgba(226,201,126,0.22);
      --text:     #f0e8d0;
      --text2:    rgba(240,232,208,0.55);
      --text3:    rgba(240,232,208,0.28);
      --drama-c:  #7eb8e2; --drama-bg: rgba(126,184,226,0.14); --drama-br: rgba(126,184,226,0.38);
      --film-c:   #e27ea8; --film-bg:  rgba(226,126,168,0.14); --film-br:  rgba(226,126,168,0.38);
      --event-c:  #7ee2b8; --event-bg: rgba(126,226,184,0.14); --event-br: rgba(126,226,184,0.38);
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Noto Sans KR', 'Noto Serif TC', sans-serif;
      min-height: 100vh;
    }

    /* ── HEADER ── */
    .header {
      text-align: center;
      padding: 64px 24px 44px;
      border-bottom: 1px solid var(--gold-line);
      position: relative;
    }
    .header-tag {
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 11px;
      letter-spacing: 0.35em;
      color: var(--gold);
      opacity: 0.75;
      margin-bottom: 18px;
    }
    .header-title {
      font-family: 'Noto Serif KR', serif;
      font-size: clamp(30px, 6vw, 52px);
      font-weight: 300;
      letter-spacing: 0.1em;
      color: #f8f0dd;
      line-height: 1.15;
    }
    .header-rule {
      width: 40px; height: 1px;
      background: var(--gold);
      margin: 22px auto;
      opacity: 0.6;
    }
    .header-range {
      font-size: 12px;
      color: var(--text3);
      letter-spacing: 0.18em;
    }

    /* ── FILTERS ── */
    .filters {
      display: flex;
      justify-content: center;
      gap: 10px;
      padding: 36px 24px 0;
      flex-wrap: wrap;
    }
    .filter-btn {
      padding: 8px 26px;
      border-radius: 2px;
      border: 1px solid rgba(240,232,208,0.15);
      background: transparent;
      color: rgba(240,232,208,0.45);
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 13px;
      letter-spacing: 0.12em;
      cursor: pointer;
      transition: all 0.22s ease;
    }
    .filter-btn:hover { border-color: var(--gold); color: var(--gold); }
    .filter-btn.active-all    { border-color: var(--gold);     background: var(--gold-dim);   color: var(--gold); }
    .filter-btn.active-drama  { border-color: var(--drama-c);  background: var(--drama-bg);   color: var(--drama-c); }
    .filter-btn.active-film   { border-color: var(--film-c);   background: var(--film-bg);    color: var(--film-c); }
    .filter-btn.active-event  { border-color: var(--event-c);  background: var(--event-bg);   color: var(--event-c); }

    /* ── TIMELINE ── */
    .timeline-wrap {
      max-width: 740px;
      margin: 52px auto 0;
      padding: 0 24px 100px;
      position: relative;
    }
    .tl-axis {
      position: absolute;
      left: calc(24px + 58px);
      top: 0; bottom: 0;
      width: 1px;
      background: linear-gradient(180deg,
        transparent 0%,
        var(--gold-line) 4%,
        var(--gold-line) 96%,
        transparent 100%);
      pointer-events: none;
    }

    .year-group { margin-bottom: 52px; }
    .year-group.hidden { display: none; }

    .year-header {
      display: flex;
      align-items: center;
      margin-bottom: 22px;
    }
    .year-label {
      width: 58px;
      text-align: right;
      padding-right: 18px;
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 13px;
      letter-spacing: 0.06em;
      color: var(--gold);
      font-weight: 400;
      flex-shrink: 0;
      position: relative;
      z-index: 2;
    }
    .year-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--gold);
      flex-shrink: 0;
      margin-left: -3.5px;
      box-shadow: 0 0 10px rgba(226,201,126,0.55);
      position: relative; z-index: 2;
    }

    .items-col { padding-left: 76px; }

    .work-card {
      margin-bottom: 14px;
      padding: 16px 20px;
      background: rgba(255,255,255,0.022);
      border-right: 1px solid;
      border-top: 1px solid;
      border-bottom: 1px solid;
      border-left: 3px solid;
      border-radius: 0 5px 5px 0;
      transition: background 0.2s ease;
      cursor: default;
    }
    .work-card:hover { background: rgba(255,255,255,0.044); }

    .work-card.type-drama  { border-color: var(--drama-br);  border-left-color: var(--drama-c); }
    .work-card.type-film   { border-color: var(--film-br);   border-left-color: var(--film-c); }
    .work-card.type-event  { border-color: var(--event-br);  border-left-color: var(--event-c); }

    .card-top { display: flex; align-items: flex-start; gap: 10px; flex-wrap: wrap; }

    .type-badge {
      font-size: 10px;
      letter-spacing: 0.1em;
      border-radius: 2px;
      padding: 2px 9px;
      border: 1px solid;
      flex-shrink: 0;
      margin-top: 2px;
    }
    .type-badge.type-drama { color: var(--drama-c); background: var(--drama-bg); border-color: var(--drama-br); }
    .type-badge.type-film  { color: var(--film-c);  background: var(--film-bg);  border-color: var(--film-br); }
    .type-badge.type-event { color: var(--event-c); background: var(--event-bg); border-color: var(--event-br); }

    .card-body { flex: 1; min-width: 0; }
    .card-title {
      font-family: 'Noto Serif TC', 'Noto Serif KR', serif;
      font-size: 15px;
      font-weight: 400;
      letter-spacing: 0.05em;
      color: #f0e8d0;
      margin-bottom: 6px;
      line-height: 1.4;
    }
    .card-month {
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 11px;
      color: var(--gold);
      opacity: 0.7;
      margin-right: 7px;
    }
    .card-desc {
      font-size: 13px;
      color: var(--text2);
      line-height: 1.65;
      letter-spacing: 0.03em;
    }
    .card-tags {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 10px;
    }
    .tag {
      font-size: 10px;
      letter-spacing: 0.06em;
      color: var(--text3);
      border: 1px solid rgba(240,232,208,0.14);
      border-radius: 2px;
      padding: 1px 7px;
    }

    /* ── END ── */
    .tl-end {
      padding-left: 76px;
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 11px;
      letter-spacing: 0.25em;
      color: rgba(226,201,126,0.3);
    }

    /* ── FOOTER ── */
    footer {
      text-align: center;
      padding: 24px;
      font-size: 11px;
      color: var(--text3);
      letter-spacing: 0.2em;
      border-top: 1px solid var(--gold-line);
    }

    @media (max-width: 480px) {
      .tl-axis { left: calc(24px + 46px); }
      .year-label { width: 46px; padding-right: 14px; }
      .items-col { padding-left: 60px; }
      .tl-end { padding-left: 60px; }
    }
  </style>
</head>
<body>

<header class="header">
  <div class="header-tag">LEE SOO-HYUK · 이수혁 · 李洙赫</div>
  <h1 class="header-title">作品年表</h1>
  <div class="header-rule"></div>
  <div class="header-range">2006 — 2026</div>
</header>

<div class="filters">
  <button class="filter-btn active-all"   onclick="setFilter('全部',  this)">全部</button>
  <button class="filter-btn"              onclick="setFilter('電視劇',this)">電視劇</button>
  <button class="filter-btn"              onclick="setFilter('電影',  this)">電影</button>
  <button class="filter-btn"              onclick="setFilter('活動',  this)">活動</button>
</div>

<div class="timeline-wrap">
  <div class="tl-axis"></div>
  <div id="timeline"></div>
  <div class="tl-end">∞ 持續更新中</div>
</div>

<footer>LSH · 豹 · 2006 –</footer>

<script>
const works = [
  { year:2006, title:"模特兒出道", type:"活動", desc:"與 G-Dragon、Kim Woo-bin 等同期活躍於韓國時尚圈。", tags:[] },
  { year:2010, title:"《依帕內瑪少年》", type:"電影", desc:"文藝電影，演員初期代表作。", tags:["文藝","初期代表作"] },
  { year:2011, title:"《White Christmas》", type:"電視劇", desc:"陰鬱心理校園劇，建立「病嬌美男」形象的重要作品。", tags:["心理劇","病嬌美男"] },
  { year:2011, title:"《吸血鬼偶像》", type:"電視劇", desc:"情境喜劇，少見搞笑演出。", tags:["喜劇"] },
  { year:2012, title:"《車警官》", type:"電影", desc:"模特圈喜劇電影。", tags:["喜劇"] },
  { year:2013, title:"《鯊魚》", type:"電視劇", desc:"與 Kim Nam-gil 合作。", tags:[] },
  { year:2013, title:"《恐怖故事2》", type:"電影", desc:"驚悚短篇作品。", tags:["驚悚"] },
  { year:2014, title:"《高校處世王》", type:"電視劇", desc:"冷帥財閥氣場開始成形。", tags:["財閥","冷帥"] },
  { year:2014, title:"《有理的愛》", type:"電視劇", desc:"感性成熟角色。", tags:["感性"] },
  { year:2015, title:"《夜行書生》", type:"電視劇", desc:"飾演吸血鬼反派「鬼」，經典代表角色之一，很多人因此入坑。", tags:["吸血鬼","反派","經典"] },
  { year:2016, title:"《好運羅曼史》", type:"電視劇", desc:"溫柔科技宅男角色。", tags:["浪漫"] },
  { year:2020, title:"《Born Again／重生》", type:"電視劇", desc:"前世今生懸疑愛情劇，與 Jang Ki-yong、Jin Se-yeon 主演，飾演檢察官金秀赫。", tags:["懸疑","愛情"] },
  { year:2021, title:"《Pipeline 管線》", type:"電影", desc:"犯罪動作電影。", tags:["犯罪","動作"] },
  { year:2021, title:"《某一天滅亡來到我家門前》", type:"電視劇", desc:"飾演出版社室長「車主益」，名場面超多，海外人氣大增。", tags:["奇幻","人氣"] },
  { year:2022, title:"《還有明天》", type:"電視劇", desc:"飾演死神組長朴重吉，粉絲人氣高峰角色之一。", tags:["奇幻","人氣高峰"] },
  { year:2023, title:"時尚活動・品牌代言", type:"活動", desc:"持續維持高級精品形象，活躍於時尚圈。", tags:["時尚","代言"] },
  { year:2024, title:"《于氏王后》", type:"電視劇", desc:"古裝權力鬥爭劇，帝王氣場很強。", tags:["古裝","權謀"] },
  { year:2025, title:"《파란／Lost》", type:"電影", desc:"心理懸疑電影。", tags:["心理","懸疑"] },
  { year:2025, title:"《S LINE》", type:"電視劇", desc:"黑暗奇幻題材，話題度很高。", tags:["黑暗奇幻","話題"] },
  { year:2025, month:"11/21", title:"《杭州飯咪》", type:"活動", desc:"時隔10年的官方見面會 #1。", tags:[] },
  { year:2026, month:"01/28", title:"《Sister》", type:"電影", desc:"黑暗犯罪題材，傳聞挑戰更瘋狂反派角色。", tags:["犯罪","反派"] },
  { year:2026, month:"05/30", title:"《上海飯咪》", type:"活動", desc:"時隔10年的官方見面會 #2。", tags:[] },
  { year:2026, month:"05/31", title:"《弘大生咖》", type:"活動", desc:"第一次韓粉小型慶生會。", tags:[] },
  { year:2026, month:"06/09", title:"《MESSIKA》", type:"活動", desc:"珠寶大使活動。", tags:[] },
];

const TYPE_CLASS = { 電視劇:"type-drama", 電影:"type-film", 活動:"type-event" };

let currentFilter = "全部";

function setFilter(f, btn) {
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => {
    b.className = 'filter-btn';
  });
  const cls = f === "全部" ? "active-all"
    : f === "電視劇" ? "active-drama"
    : f === "電影"   ? "active-film"
    : "active-event";
  btn.classList.add(cls);
  render();
}

function render() {
  const filtered = currentFilter === "全部"
    ? works
    : works.filter(w => w.type === currentFilter);

  const grouped = {};
  filtered.forEach(w => {
    if (!grouped[w.year]) grouped[w.year] = [];
    grouped[w.year].push(w);
  });

  const years = Object.keys(grouped).sort((a,b) => +a - +b);
  const tl = document.getElementById('timeline');
  tl.innerHTML = '';

  years.forEach(year => {
    const group = document.createElement('div');
    group.className = 'year-group';

    const hdr = document.createElement('div');
    hdr.className = 'year-header';
    hdr.innerHTML = `<div class="year-label">${year}</div><div class="year-dot"></div>`;
    group.appendChild(hdr);

    const col = document.createElement('div');
    col.className = 'items-col';

    grouped[year].forEach(item => {
      const tc = TYPE_CLASS[item.type] || 'type-event';
      const monthHtml = item.month
        ? `<span class="card-month">${item.month}</span>`
        : '';
      const tagsHtml = item.tags.length
        ? `<div class="card-tags">${item.tags.map(t=>`<span class="tag">#${t}</span>`).join('')}</div>`
        : '';

      const card = document.createElement('div');
      card.className = `work-card ${tc}`;
      card.innerHTML = `
        <div class="card-top">
          <span class="type-badge ${tc}">${item.type}</span>
          <div class="card-body">
            <div class="card-title">${monthHtml}${item.title}</div>
            <div class="card-desc">${item.desc}</div>
            ${tagsHtml}
          </div>
        </div>`;
      col.appendChild(card);
    });

    group.appendChild(col);
    tl.appendChild(group);
  });
}

render();
</script>
</body>
</html>
