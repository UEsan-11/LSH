<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>小赫米追星百科 · 이수혁 Media Archive</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@200;300;400&family=Noto+Serif+TC:wght@300;400&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="assets/css/style.css"/>
  <style>
    /* ── archive 專屬 ── */

    .page-wrap { max-width: 1100px; margin: 0 auto; padding: 0 24px; }

    /* HEADER */
    .archive-header {
      padding: 110px 24px 48px;
      border-bottom: 1px solid var(--gold-line);
      text-align: center;
    }
    .archive-header .eyebrow {
      font-size: 11px; letter-spacing: 0.35em;
      color: var(--gold); opacity: 0.7; margin-bottom: 14px;
    }
    .archive-header h1 {
      font-family: 'Noto Serif KR', serif;
      font-size: clamp(26px, 4vw, 44px);
      font-weight: 300; letter-spacing: 0.1em; color: #f8f0dd;
    }
    .archive-header .sub {
      font-size: 12px; color: var(--text3);
      letter-spacing: 0.18em; margin-top: 14px;
    }
    .header-rule { width: 40px; height: 1px; background: var(--gold); margin: 18px auto; opacity: 0.5; }

    /* TOOLBAR */
    .archive-toolbar {
      display: flex; justify-content: space-between;
      align-items: center; flex-wrap: wrap; gap: 16px;
      padding: 32px 0 0;
    }
    .cat-filters { display: flex; gap: 8px; flex-wrap: wrap; }
    .cat-btn {
      padding: 6px 16px; border-radius: 20px;
      border: 1px solid rgba(240,232,208,0.15);
      background: transparent; color: rgba(240,232,208,0.45);
      font-size: 11px; letter-spacing: 0.1em; cursor: pointer;
      transition: all 0.2s; font-family: 'Noto Sans KR', sans-serif;
    }
    .cat-btn:hover { border-color: var(--gold); color: var(--gold); }
    .cat-btn.active { border-color: var(--gold); background: var(--gold-dim); color: var(--gold); }
    .cat-btn.cat-event  { --c: #7eb8e2; }
    .cat-btn.cat-show   { --c: #e2b87e; }
    .cat-btn.cat-media  { --c: #e27ea8; }
    .cat-btn.cat-ig     { --c: #c47ee2; }
    .cat-btn.cat-video  { --c: #7ee2b8; }
    .cat-btn.active.cat-event { border-color:#7eb8e2; background:rgba(126,184,226,0.14); color:#7eb8e2; }
    .cat-btn.active.cat-show  { border-color:#e2b87e; background:rgba(226,184,126,0.14); color:#e2b87e; }
    .cat-btn.active.cat-media { border-color:#e27ea8; background:rgba(226,126,168,0.14); color:#e27ea8; }
    .cat-btn.active.cat-ig    { border-color:#c47ee2; background:rgba(196,126,226,0.14); color:#c47ee2; }
    .cat-btn.active.cat-video { border-color:#7ee2b8; background:rgba(126,226,184,0.14); color:#7ee2b8; }

    .apply-btn {
      padding: 8px 20px; border-radius: 2px;
      border: 1px solid rgba(226,201,126,0.35);
      background: var(--gold-dim); color: var(--gold);
      font-size: 11px; letter-spacing: 0.15em; cursor: pointer;
      transition: all 0.2s; font-family: 'Noto Sans KR', sans-serif;
    }
    .apply-btn:hover { background: rgba(226,201,126,0.28); }

    /* MAIN LAYOUT */
    .archive-layout {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 32px;
      padding: 32px 0 100px;
      align-items: start;
    }

    /* ── CALENDAR ── */
    .calendar-panel {
      position: sticky; top: 80px;
    }
    .cal-nav {
      display: flex; align-items: center;
      justify-content: space-between; margin-bottom: 16px;
    }
    .cal-nav-btn {
      background: none; border: none; color: var(--text3);
      cursor: pointer; font-size: 16px; padding: 4px 8px;
      transition: color 0.2s;
    }
    .cal-nav-btn:hover { color: var(--gold); }
    .cal-month-label {
      font-family: 'Noto Serif KR', serif;
      font-size: 14px; font-weight: 300;
      color: var(--text); letter-spacing: 0.1em;
    }
    .cal-grid {
      display: grid; grid-template-columns: repeat(7, 1fr);
      gap: 2px;
    }
    .cal-dow {
      text-align: center; font-size: 9px; letter-spacing: 0.1em;
      color: var(--text3); padding: 4px 0 8px;
    }
    .cal-day {
      aspect-ratio: 1; border-radius: 3px;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      font-size: 11px; color: var(--text3);
      cursor: default; position: relative;
      transition: all 0.15s;
    }
    .cal-day.has-content {
      color: var(--text2); cursor: pointer;
    }
    .cal-day.has-content:hover { background: rgba(226,201,126,0.08); color: var(--gold); }
    .cal-day.active { background: var(--gold-dim) !important; color: var(--gold) !important; }
    .cal-day.today { color: var(--gold); font-weight: 500; }
    .cal-day .dot {
      position: absolute; bottom: 3px;
      width: 3px; height: 3px; border-radius: 50%;
      background: var(--gold);
    }
    .cal-day.empty { pointer-events: none; }

    /* 月統計 */
    .cal-stats {
      margin-top: 20px; padding: 14px 16px;
      border: 1px solid var(--gold-line); border-radius: 4px;
      background: rgba(255,255,255,0.02);
    }
    .cal-stats-title { font-size: 9px; letter-spacing: 0.2em; color: var(--gold); opacity: 0.6; margin-bottom: 10px; }
    .cal-stats-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .cal-stats-label { font-size: 11px; color: var(--text3); }
    .cal-stats-val { font-size: 13px; color: var(--text2); font-family: 'Noto Serif KR', serif; }

    /* ── MEDIA GRID ── */
    .media-panel {}
    .media-date-group { margin-bottom: 40px; }
    .media-date-header {
      display: flex; align-items: center; gap: 14px;
      margin-bottom: 16px; padding-bottom: 10px;
      border-bottom: 1px solid var(--gold-line);
    }
    .media-date-label {
      font-family: 'Noto Serif KR', serif;
      font-size: 13px; color: var(--gold);
      letter-spacing: 0.08em; font-weight: 300;
    }
    .media-event-name { font-size: 11px; color: var(--text3); letter-spacing: 0.1em; }
    .media-count { font-size: 10px; color: var(--text3); margin-left: auto; letter-spacing: 0.1em; }

    .media-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 10px;
    }
    .media-card {
      border-radius: 4px; overflow: hidden;
      border: 1px solid var(--gold-line);
      background: var(--bg3);
      cursor: pointer; position: relative;
      transition: border-color 0.2s, transform 0.2s;
    }
    .media-card:hover { border-color: rgba(226,201,126,0.4); transform: translateY(-2px); }
    .media-card.wide { grid-column: span 2; }

    .media-thumb {
      width: 100%; aspect-ratio: 4/3;
      object-fit: cover; display: block;
      opacity: 0.85; transition: opacity 0.3s;
    }
    .media-card:hover .media-thumb { opacity: 1; }
    .media-thumb-ph {
      width: 100%; aspect-ratio: 4/3;
      background: var(--bg2);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 8px;
    }
    .media-thumb-ph svg { opacity: 0.12; }
    .media-thumb-ph span { font-size: 9px; letter-spacing: 0.15em; color: var(--text3); }

    /* 影片 overlay */
    .video-overlay {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: rgba(10,10,15,0.35);
    }
    .play-icon {
      width: 40px; height: 40px; border-radius: 50%;
      background: rgba(226,201,126,0.85);
      display: flex; align-items: center; justify-content: center;
    }
    .play-icon svg { margin-left: 3px; }

    .media-info { padding: 10px 12px 12px; }
    .media-cat-badge {
      display: inline-block; font-size: 9px; letter-spacing: 0.1em;
      padding: 1px 7px; border-radius: 2px; border: 1px solid;
      margin-bottom: 6px;
    }
    .badge-event { color:#7eb8e2; background:rgba(126,184,226,0.12); border-color:rgba(126,184,226,0.3); }
    .badge-show  { color:#e2b87e; background:rgba(226,184,126,0.12); border-color:rgba(226,184,126,0.3); }
    .badge-media { color:#e27ea8; background:rgba(226,126,168,0.12); border-color:rgba(226,126,168,0.3); }
    .badge-ig    { color:#c47ee2; background:rgba(196,126,226,0.12); border-color:rgba(196,126,226,0.3); }
    .badge-video { color:#7ee2b8; background:rgba(126,226,184,0.12); border-color:rgba(126,226,184,0.3); }

    .media-caption { font-size: 11px; color: var(--text2); line-height: 1.5; }
    .media-uploader { font-size: 10px; color: var(--text3); margin-top: 5px; letter-spacing: 0.06em; }

    /* EMPTY */
    .media-empty {
      grid-column: 1/-1; padding: 60px 0;
      text-align: center; color: var(--text3);
      font-size: 12px; letter-spacing: 0.2em;
    }

    /* ── LIGHTBOX ── */
    .lightbox {
      display: none; position: fixed; inset: 0; z-index: 300;
      background: rgba(5,5,10,0.95);
      align-items: center; justify-content: center;
    }
    .lightbox.open { display: flex; }
    .lightbox-inner { position: relative; max-width: 900px; width: 100%; padding: 24px; }
    .lightbox img {
      width: 100%; max-height: 80vh; object-fit: contain;
      border-radius: 4px; display: block;
    }
    .lightbox-close {
      position: absolute; top: 0; right: 24px;
      background: none; border: none; color: var(--text3);
      font-size: 24px; cursor: pointer; transition: color 0.2s;
    }
    .lightbox-close:hover { color: var(--gold); }
    .lightbox-caption {
      margin-top: 14px; font-size: 13px; color: var(--text2);
      text-align: center; letter-spacing: 0.06em;
    }

    /* ── APPLY MODAL ── */
    .apply-modal-backdrop {
      display: none; position: fixed; inset: 0; z-index: 200;
      background: rgba(10,10,15,0.88);
      align-items: center; justify-content: center; padding: 24px;
    }
    .apply-modal-backdrop.open { display: flex; }
    .apply-modal {
      background: var(--bg2); border: 1px solid var(--gold-line);
      border-radius: 6px; width: 100%; max-width: 440px;
      padding: 36px 32px; position: relative;
    }
    .modal-close-btn {
      position: absolute; top: 16px; right: 20px;
      background: none; border: none; color: var(--text3);
      font-size: 20px; cursor: pointer; transition: color 0.2s;
    }
    .modal-close-btn:hover { color: var(--gold); }
    .modal-ttl {
      font-family: 'Noto Serif KR', serif;
      font-size: 20px; font-weight: 300; letter-spacing: 0.08em;
      color: var(--text); margin-bottom: 6px;
    }
    .modal-sub { font-size: 12px; color: var(--text3); letter-spacing: 0.1em; margin-bottom: 28px; }
    .form-group { margin-bottom: 16px; }
    .form-label { font-size: 10px; letter-spacing: 0.2em; color: var(--gold); opacity: 0.7; display: block; margin-bottom: 7px; }
    .form-input, .form-textarea {
      width: 100%; padding: 10px 14px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(240,232,208,0.15);
      border-radius: 3px; color: var(--text);
      font-size: 13px; font-family: 'Noto Sans KR', sans-serif;
      outline: none; transition: border-color 0.2s;
    }
    .form-input:focus, .form-textarea:focus { border-color: var(--gold); }
    .form-textarea { resize: vertical; min-height: 80px; }
    .form-submit {
      width: 100%; padding: 12px;
      border: 1px solid var(--gold); background: var(--gold-dim); color: var(--gold);
      font-size: 13px; letter-spacing: 0.15em; border-radius: 2px; cursor: pointer;
      font-family: 'Noto Sans KR', sans-serif; transition: background 0.2s; margin-top: 8px;
    }
    .form-submit:hover { background: rgba(226,201,126,0.28); }
    .form-msg { font-size: 12px; text-align: center; margin-top: 12px; letter-spacing: 0.08em; min-height: 18px; }
    .form-msg.ok  { color: #7ee2b8; }
    .form-msg.err { color: #e27e7e; }

    /* RESPONSIVE */
    @media (max-width: 720px) {
      .archive-layout { grid-template-columns: 1fr; }
      .calendar-panel { position: static; }
      .media-grid { grid-template-columns: 1fr 1fr; }
      .media-card.wide { grid-column: span 1; }
    }
    @media (max-width: 480px) {
      .media-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>

<script>
/* ══════════════════
   靜態預覽資料
   ══════════════════ */
const archive = [
  {
    id:1, date:'2026-06-09', event:'MESSIKA 珠寶大使活動',
    type:'現場', caption:'MESSIKA 活動現場，氣場全開。',
    uploader:'hyukmi', img: null,
  },
  {
    id:2, date:'2026-06-09', event:'MESSIKA 珠寶大使活動',
    type:'現場', caption:'活動側拍。',
    uploader:'hyukmi', img: null,
  },
  {
    id:3, date:'2026-05-31', event:'弘大生日咖啡廳',
    type:'現場', caption:'韓國粉絲慶生活動現場。',
    uploader:'hyukmi', img: null,
  },
  {
    id:4, date:'2026-05-30', event:'上海粉絲見面會',
    type:'現場', caption:'上海見面會，時隔10年 #2。',
    uploader:'hyukmi', img: null,
  },
  {
    id:5, date:'2026-05-30', event:'上海粉絲見面會',
    type:'影片', caption:'見面會精華影片。',
    uploader:'hyukmi', img: null, videoUrl: 'https://www.youtube.com/watch?v=dQw4w9WgXcQ',
  },
  {
    id:6, date:'2025-11-21', event:'杭州粉絲見面會',
    type:'現場', caption:'杭州見面會，時隔10年 #1。',
    uploader:'kumy', img: null,
  },
  {
    id:7, date:'2025-11-21', event:'杭州粉絲見面會',
    type:'現場', caption:'SVIP 見面會現場。',
    uploader:'爰爰', img: null,
  },
  {
    id:8, date:'2025-11-21', event:'杭州粉絲見面會',
    type:'影片', caption:'見面會開場影片。',
    uploader:'hyukmi', img: null, videoUrl: null,
  },
  {
    id:9, date:'2024-01-01', event:'于氏王后 宣傳期',
    type:'節目', caption:'于氏王后 綜藝宣傳截圖。',
    uploader:'hyukmi', img: null,
  },
  {
    id:10, date:'2013-07-01', event:'Paris Fashion Week F/W 2013',
    type:'時尚', caption:'Balenciaga Menswear 走秀現場。',
    uploader:'hyukmi', img: null,
  },
];

/* ══════════════════
   狀態
   ══════════════════ */
let currentFilter = '全部';
let currentYear   = new Date().getFullYear();
let currentMonth  = new Date().getMonth(); // 0-based
let selectedDate  = null;

const CAT_BADGE = {
  現場: 'badge-event',
  時尚: 'badge-show',
  節目: 'badge-media',
  IG:   'badge-ig',
  影片: 'badge-video',
};

/* ══════════════════
   FILTER
   ══════════════════ */
function setFilter(f, btn) {
  currentFilter = f;
  selectedDate  = null;
  document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  buildCalendar();
  renderMedia();
}

function getFiltered() {
  let list = currentFilter === '全部' ? archive : archive.filter(i => i.type === currentFilter);
  if (selectedDate) list = list.filter(i => i.date === selectedDate);
  return list;
}

/* ══════════════════
   CALENDAR
   ══════════════════ */
const MONTHS_ZH = ['一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'];
const DOWS = ['日','一','二','三','四','五','六'];

function changeMonth(delta) {
  currentMonth += delta;
  if (currentMonth < 0)  { currentMonth = 11; currentYear--; }
  if (currentMonth > 11) { currentMonth = 0;  currentYear++; }
  selectedDate = null;
  buildCalendar();
  renderMedia();
}

function buildCalendar() {
  const label = document.getElementById('calMonthLabel');
  label.textContent = `${currentYear} · ${MONTHS_ZH[currentMonth]}`;

  const grid = document.getElementById('calGrid');
  grid.innerHTML = '';

  // 星期標題
  DOWS.forEach(d => {
    const el = document.createElement('div');
    el.className = 'cal-dow';
    el.textContent = d;
    grid.appendChild(el);
  });

  const firstDay = new Date(currentYear, currentMonth, 1).getDay();
  const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
  const today = new Date();

  // 找出本月有內容的日期
  const contentDates = new Set(
    archive
      .filter(i => {
        const d = new Date(i.date);
        return d.getFullYear() === currentYear && d.getMonth() === currentMonth
          && (currentFilter === '全部' || i.type === currentFilter);
      })
      .map(i => i.date)
  );

  // 空格
  for (let i = 0; i < firstDay; i++) {
    const el = document.createElement('div');
    el.className = 'cal-day empty';
    grid.appendChild(el);
  }

  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = `${currentYear}-${String(currentMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const el = document.createElement('div');
    el.className = 'cal-day';
    el.textContent = d;

    const isToday = today.getFullYear()===currentYear && today.getMonth()===currentMonth && today.getDate()===d;
    if (isToday) el.classList.add('today');
    if (contentDates.has(dateStr)) {
      el.classList.add('has-content');
      const dot = document.createElement('div');
      dot.className = 'dot';
      el.appendChild(dot);
      el.onclick = () => selectDate(dateStr, el);
    }
    if (selectedDate === dateStr) el.classList.add('active');
    grid.appendChild(el);
  }

  // 統計
  buildStats(contentDates);
}

function buildStats(contentDates) {
  const monthItems = archive.filter(i => {
    const d = new Date(i.date);
    return d.getFullYear()===currentYear && d.getMonth()===currentMonth;
  });
  const stats = document.getElementById('calStats');
  const counts = {};
  monthItems.forEach(i => { counts[i.type] = (counts[i.type]||0)+1; });
  const rows = Object.entries(counts).map(([k,v]) =>
    `<div class="cal-stats-row"><span class="cal-stats-label">${k}</span><span class="cal-stats-val">${v}</span></div>`
  ).join('') || '<div class="cal-stats-row"><span class="cal-stats-label" style="font-size:10px">本月暫無資料</span></div>';
  stats.innerHTML = `<div class="cal-stats-title">本月統計 · ${currentYear}/${currentMonth+1}</div>${rows}`;
}

function selectDate(dateStr, el) {
  if (selectedDate === dateStr) {
    selectedDate = null;
    document.querySelectorAll('.cal-day').forEach(d => d.classList.remove('active'));
  } else {
    selectedDate = dateStr;
    document.querySelectorAll('.cal-day').forEach(d => d.classList.remove('active'));
    el.classList.add('active');
  }
  renderMedia();
}

/* ══════════════════
   MEDIA RENDER
   ══════════════════ */
function renderMedia() {
  const list = getFiltered();
  const container = document.getElementById('mediaContent');

  if (!list.length) {
    container.innerHTML = `<div class="media-empty">— 暫無資料 —</div>`;
    return;
  }

  // 依日期分組（新→舊）
  const grouped = {};
  list.forEach(item => {
    if (!grouped[item.date]) grouped[item.date] = [];
    grouped[item.date].push(item);
  });
  const dates = Object.keys(grouped).sort((a,b) => b.localeCompare(a));

  container.innerHTML = dates.map(date => {
    const items = grouped[date];
    const eventName = items[0].event || '';
    const cards = items.map(item => {
      const badge = CAT_BADGE[item.type] || 'badge-event';
      const isVideo = item.type === '影片';

      const thumbHtml = item.img
        ? `<img class="media-thumb" src="${item.img}" alt="${item.caption}" loading="lazy"
             onclick="openLightbox('${item.img}','${item.caption.replace(/'/g,"\\'")}')"/>`
        : `<div class="media-thumb-ph">
             <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
               ${isVideo
                 ? '<rect x="2" y="5" width="24" height="18" rx="3" stroke="#e2c97e" stroke-width="1"/><polygon points="10,9 10,19 20,14" fill="#e2c97e" opacity="0.4"/>'
                 : '<rect x="2" y="5" width="24" height="18" rx="3" stroke="#e2c97e" stroke-width="1"/><circle cx="14" cy="14" r="4" stroke="#e2c97e" stroke-width="1"/>'}
             </svg>
             <span>${isVideo ? 'VIDEO' : 'PHOTO'}</span>
           </div>`;

      const videoOverlay = isVideo
        ? `<div class="video-overlay"><div class="play-icon"><svg width="12" height="14" viewBox="0 0 12 14" fill="none"><polygon points="0,0 12,7 0,14" fill="#0a0a0f"/></svg></div></div>`
        : '';

      return `
        <div class="media-card${item.type==='現場'&&items.indexOf(item)===0?' wide':''}">
          <div style="position:relative">
            ${thumbHtml}
            ${videoOverlay}
          </div>
          <div class="media-info">
            <span class="media-cat-badge ${badge}">${item.type}</span>
            ${item.caption ? `<div class="media-caption">${item.caption}</div>` : ''}
            <div class="media-uploader">↑ ${item.uploader}</div>
          </div>
        </div>`;
    }).join('');

    return `
      <div class="media-date-group">
        <div class="media-date-header">
          <div class="media-date-label">${date}</div>
          <div class="media-event-name">${eventName}</div>
          <div class="media-count">${items.length} 筆</div>
        </div>
        <div class="media-grid">${cards}</div>
      </div>`;
  }).join('');
}

/* ══════════════════
   LIGHTBOX
   ══════════════════ */
function openLightbox(src, caption) {
  document.getElementById('lightboxImg').src = src;
  document.getElementById('lightboxCaption').textContent = caption;
  document.getElementById('lightbox').classList.add('open');
}
function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLightbox(); });

/* ══════════════════
   APPLY MODAL
   ══════════════════ */
function openApply()  { document.getElementById('applyModal').classList.add('open'); }
function closeApply() { document.getElementById('applyModal').classList.remove('open'); }
document.getElementById('applyModal').addEventListener('click', e => {
  if (e.target === document.getElementById('applyModal')) closeApply();
});

function submitApply() {
  const name    = document.getElementById('applyName').value.trim();
  const contact = document.getElementById('applyContact').value.trim();
  const desc    = document.getElementById('applyDesc').value.trim();
  const msg     = document.getElementById('applyMsg');
  if (!name || !contact) {
    msg.className = 'form-msg err'; msg.textContent = '請填入名稱和聯絡方式'; return;
  }
  /* 之後接 Supabase 或 Formspree 送出申請 */
  msg.className = 'form-msg ok';
  msg.textContent = '✦ 申請已送出！審核後會透過你的聯絡方式回覆。';
  setTimeout(() => {
    closeApply();
    msg.textContent = '';
  }, 2500);
}

/* ══════════════════
   INIT
   ══════════════════ */
buildCalendar();
renderMedia();
</script>
