    /* ══════════════════
       狀態
       ══════════════════ */
    let currentFilter = '全部';
    let currentYear = new Date().getFullYear();
    let currentMonth = new Date().getMonth(); // 0-based
    let selectedDate = null;

    const CAT_BADGE = {
      現場: 'badge-event',
      時尚: 'badge-show',
      節目: 'badge-media',
      IG: 'badge-ig',
      影片: 'badge-video',
    };

    /* ══════════════════
       FILTER
       ══════════════════ */
    function setFilter(f, btn) {
      currentFilter = f;
      selectedDate = null;
      document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      buildCalendar();
      renderMedia();
    }

    function getFiltered() {
      let list = currentFilter === '全部' ? archive : archive.filter(i => i.type === currentFilter);
      if (selectedDate) list = list.filter(i => i.date === selectedDate);
      return list;
    }

    /* ══════════════════
       CALENDAR
       ══════════════════ */
    const MONTHS_ZH = ['一月', '二月', '三月', '四月', '五月', '六月', '七月', '八月', '九月', '十月', '十一月', '十二月'];
    const DOWS = ['日', '一', '二', '三', '四', '五', '六'];

    function changeMonth(delta) {
      currentMonth += delta;
      if (currentMonth < 0) { currentMonth = 11; currentYear--; }
      if (currentMonth > 11) { currentMonth = 0; currentYear++; }
      selectedDate = null;
      buildCalendar();
      renderMedia();
    }

    function buildCalendar() {
      const label = document.getElementById('calMonthLabel');
      label.textContent = `${currentYear} · ${MONTHS_ZH[currentMonth]}`;

      const grid = document.getElementById('calGrid');
      grid.innerHTML = '';

      // 星期標題
      DOWS.forEach(d => {
        const el = document.createElement('div');
        el.className = 'cal-dow';
        el.textContent = d;
        grid.appendChild(el);
      });

      const firstDay = new Date(currentYear, currentMonth, 1).getDay();
      const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
      const today = new Date();

      // 找出本月有內容的日期
      const contentDates = new Set(
        archive
          .filter(i => {
            const d = new Date(i.date);
            return d.getFullYear() === currentYear && d.getMonth() === currentMonth
              && (currentFilter === '全部' || i.type === currentFilter);
          })
          .map(i => i.date)
      );

      // 空格
      for (let i = 0; i < firstDay; i++) {
        const el = document.createElement('div');
        el.className = 'cal-day empty';
        grid.appendChild(el);
      }

      for (let d = 1; d <= daysInMonth; d++) {
        const dateStr = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
        const el = document.createElement('div');
        el.className = 'cal-day';
        el.textContent = d;

        const isToday = today.getFullYear() === currentYear && today.getMonth() === currentMonth && today.getDate() === d;
        if (isToday) el.classList.add('today');
        if (contentDates.has(dateStr)) {
          el.classList.add('has-content');
          const dot = document.createElement('div');
          dot.className = 'dot';
          el.appendChild(dot);
          el.onclick = () => selectDate(dateStr, el);
        }
        if (selectedDate === dateStr) el.classList.add('active');
        grid.appendChild(el);
      }

      // 統計
      buildStats(contentDates);
    }

    function buildStats(contentDates) {
      const monthItems = archive.filter(i => {
        const d = new Date(i.date);
        return d.getFullYear() === currentYear && d.getMonth() === currentMonth;
      });
      const stats = document.getElementById('calStats');
      const counts = {};
      monthItems.forEach(i => { counts[i.type] = (counts[i.type] || 0) + 1; });
      const rows = Object.entries(counts).map(([k, v]) =>
        `<div class="cal-stats-row"><span class="cal-stats-label">${k}</span><span class="cal-stats-val">${v}</span></div>`
      ).join('') || '<div class="cal-stats-row"><span class="cal-stats-label" style="font-size:10px">本月暫無資料</span></div>';
      stats.innerHTML = `<div class="cal-stats-title">本月統計 · ${currentYear}/${currentMonth + 1}</div>${rows}`;
    }

    function selectDate(dateStr, el) {
      if (selectedDate === dateStr) {
        selectedDate = null;
        document.querySelectorAll('.cal-day').forEach(d => d.classList.remove('active'));
      } else {
        selectedDate = dateStr;
        document.querySelectorAll('.cal-day').forEach(d => d.classList.remove('active'));
        el.classList.add('active');
      }
      renderMedia();
    }

    /* ══════════════════
       MEDIA RENDER
       ══════════════════ */
    function renderMedia() {
      const list = getFiltered();
      const container = document.getElementById('mediaContent');

      if (!list.length) {
        container.innerHTML = `<div class="media-empty">— 暫無資料 —</div>`;
        return;
      }

      // 依日期分組（新→舊）
      const grouped = {};
      list.forEach(item => {
        if (!grouped[item.date]) grouped[item.date] = [];
        grouped[item.date].push(item);
      });
      const dates = Object.keys(grouped).sort((a, b) => b.localeCompare(a));

      container.innerHTML = dates.map(date => {
        const items = grouped[date];
        const eventName = items[0].event || '';
        const cards = items.map(item => {
          const badge = CAT_BADGE[item.type] || 'badge-event';
          const isVideo = item.type === '影片';

          const thumbHtml = item.img
            ? `<img class="media-thumb" src="${item.img}" alt="${item.caption}" loading="lazy"
             onclick="openLightbox('${item.img}','${item.caption.replace(/'/g, "\\'")}')"/>`
            : `<div class="media-thumb-ph">
             <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
               ${isVideo
              ? '<rect x="2" y="5" width="24" height="18" rx="3" stroke="#e2c97e" stroke-width="1"/><polygon points="10,9 10,19 20,14" fill="#e2c97e" opacity="0.4"/>'
              : '<rect x="2" y="5" width="24" height="18" rx="3" stroke="#e2c97e" stroke-width="1"/><circle cx="14" cy="14" r="4" stroke="#e2c97e" stroke-width="1"/>'}
             </svg>
             <span>${isVideo ? 'VIDEO' : 'PHOTO'}</span>
           </div>`;

          const videoOverlay = isVideo
            ? `<div class="video-overlay"><div class="play-icon"><svg width="12" height="14" viewBox="0 0 12 14" fill="none"><polygon points="0,0 12,7 0,14" fill="#0a0a0f"/></svg></div></div>`
            : '';

          return `
        <div class="media-card${item.type === '現場' && items.indexOf(item) === 0 ? ' wide' : ''}">
          <div style="position:relative">
            ${thumbHtml}
            ${videoOverlay}
          </div>
          <div class="media-info">
            <span class="media-cat-badge ${badge}">${item.type}</span>
            ${item.caption ? `<div class="media-caption">${item.caption}</div>` : ''}
            <div class="media-uploader">↑ ${item.uploader}</div>
          </div>
        </div>`;
        }).join('');

        return `
      <div class="media-date-group">
        <div class="media-date-header">
          <div class="media-date-label">${date}</div>
          <div class="media-event-name">${eventName}</div>
          <div class="media-count">${items.length} 筆</div>
        </div>
        <div class="media-grid">${cards}</div>
      </div>`;
      }).join('');
    }

    /* ══════════════════
       LIGHTBOX
       ══════════════════ */
    function openLightbox(src, caption) {
      document.getElementById('lightboxImg').src = src;
      document.getElementById('lightboxCaption').textContent = caption;
      document.getElementById('lightbox').classList.add('open');
    }
    function closeLightbox() {
      document.getElementById('lightbox').classList.remove('open');
    }
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLightbox(); });

    /* ══════════════════
       APPLY MODAL
       ══════════════════ */
    function openApply() { document.getElementById('applyModal').classList.add('open'); }
    function closeApply() { document.getElementById('applyModal').classList.remove('open'); }
    document.getElementById('applyModal').addEventListener('click', e => {
      if (e.target === document.getElementById('applyModal')) closeApply();
    });

    function submitApply() {
      const name = document.getElementById('applyName').value.trim();
      const contact = document.getElementById('applyContact').value.trim();
      const desc = document.getElementById('applyDesc').value.trim();
      const msg = document.getElementById('applyMsg');
      if (!name || !contact) {
        msg.className = 'form-msg err'; msg.textContent = '請填入名稱和聯絡方式'; return;
      }
      /* 之後接 Supabase 或 Formspree 送出申請 */
      msg.className = 'form-msg ok';
      msg.textContent = '✦ 申請已送出！審核後會透過你的聯絡方式回覆。';
      setTimeout(() => {
        closeApply();
        msg.textContent = '';
      }, 2500);
    }

    /* ══════════════════
       INIT
       ══════════════════ */
    buildCalendar();
    renderMedia();

    const i18n = {
      zh: {
        'page-sub': '現場照 · 節目截圖 · 時尚秀 · IG · 影片',
      },
      en: {
        'page-sub': 'Event Photos · Show Cuts · Fashion · IG · Videos',
      },
      ko: {
        'page-sub': '현장 사진 · 방송 캡처 · 패션쇼 · IG · 영상',
      },
    };

    function setLang(lang) {
      const labels = { zh: '繁中', en: 'EN', ko: '한국어' };
      document.getElementById('langLabel').textContent = labels[lang] || lang;
      const dict = Object.assign({}, i18n.zh, i18n[lang] || {});
      document.querySelectorAll('[data-i18n]').forEach(function (el) {
        const key = el.dataset.i18n;
        if (dict[key] !== undefined) el.innerHTML = dict[key];
      });
    }
    function toggleLangMenu() {
      document.getElementById('langMenu').classList.toggle('open');
    }
    document.addEventListener('click', function (e) {
      const dd = document.getElementById('langDropdown');
      if (dd && !dd.contains(e.target)) {
        document.getElementById('langMenu').classList.remove('open');
      }
    });


    /* ── 回到頂部 ── */
    window.addEventListener('scroll', function () {
      var btn = document.getElementById('backToTop');
      if (btn) btn.classList.toggle('visible', window.scrollY > 300);
    });
  </script>
</body>

</html>
