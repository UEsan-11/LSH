<!DOCTYPE html>
<html lang="zh-hant">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>應援禮物 · 이수혁 Lee Soo Hyuk</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@200;300;400;600&family=Noto+Serif+TC:wght@200;300;400&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="assets/css/style.css"/>
  <link rel="stylesheet" href="assets/css/gifts.css"/>
</head>
<body>

<!-- NAV -->
<nav class="site-nav">
  <a class="nav-logo" href="index.html">이수혁</a>
  <ul class="nav-links">
    <li><a href="about.html">ABOUT</a></li>
    <li><a href="works.html">WORKS</a></li>
    <li><a href="cheers.html">CHEERS</a></li>
    <li><a href="gifts.html" class="active">GIFTS</a></li>
    <li><a href="archive.html" >ARCHIVE</a></li>
  </ul>
  

  <div class="nav-right">
    <span class="user-name" id="navUserName"></span>
    <button class="auth-btn" id="navAuthBtn" onclick="handleAuthBtn()">登入</button>
  </div>
</nav>

<!-- HEADER -->
<header class="header">
  <div class="header-tag">LEE SOO-HYUK · 이수혁</div>
  <h1 class="header-title" data-i18n="page-title">선물 · 應援禮物</h1>
  <div class="header-rule"></div>
  <div class="header-sub" data-i18n="page-sub">粉絲免費應援禮物 · Fan Free Gifts</div>
</header>

<!-- TOOLBAR -->
<div class="toolbar">
  <div class="filter-tabs">
    <button class="filter-btn active" onclick="setFilter('全部', this)">全部</button>
    <button class="filter-btn" onclick="setFilter('壁紙', this)">壁紙/桌布</button>
    <button class="filter-btn" onclick="setFilter('貼圖', this)">貼圖包</button>
    <button class="filter-btn" onclick="setFilter('影片', this)">影片剪輯</button>
    <button class="filter-btn" onclick="setFilter('卡片', this)">卡片/圖卡</button>
    <button class="filter-btn" onclick="setFilter('實體', this)">實體周邊</button>
    <button class="filter-btn" onclick="setFilter('其他', this)">其他</button>
  </div>
  <button class="upload-btn disabled" id="uploadBtn" onclick="openUploadModal()">
    <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M7 1v8M3.5 4.5L7 1l3.5 3.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M1 10.5V13h12v-2.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
    上傳禮物
  </button>
</div>

<!-- GIFTS GRID -->
<div class="gifts-wrap">
  <div class="gifts-grid" id="giftsGrid">
    <div class="empty-state">
      <div class="es-icon">🎁</div>
      <div>載入中…</div>
    </div>
  </div>
</div>

<!-- ── AUTH MODAL ── -->
<div class="modal-backdrop" id="authModal">
  <div class="modal">
    <button class="modal-close" onclick="closeModal('authModal')">✕</button>
    <div class="modal-title">이수혁 팬클럽</div>
    <div class="modal-sub">登入 / 註冊以參與應援</div>
    <div class="auth-tabs">
      <button class="auth-tab active" onclick="switchAuthTab('login', this)">登入</button>
      <button class="auth-tab" onclick="switchAuthTab('register', this)">註冊</button>
    </div>
    <div id="authLoginForm">
      <div class="form-group">
        <label class="form-label">EMAIL</label>
        <input class="form-input" type="email" id="loginEmail" placeholder="your@email.com"/>
      </div>
      <div class="form-group">
        <label class="form-label">密碼</label>
        <input class="form-input" type="password" id="loginPwd" placeholder="••••••••"/>
      </div>
      <button class="form-submit" onclick="doLogin()">登入</button>
    </div>
    <div id="authRegisterForm" style="display:none">
      <div class="form-group">
        <label class="form-label">顯示名稱（作者名）</label>
        <input class="form-input" type="text" id="regName" placeholder="例：豹迷小花"/>
      </div>
      <div class="form-group">
        <label class="form-label">EMAIL</label>
        <input class="form-input" type="email" id="regEmail" placeholder="your@email.com"/>
      </div>
      <div class="form-group">
        <label class="form-label">密碼（至少6位）</label>
        <input class="form-input" type="password" id="regPwd" placeholder="••••••••"/>
      </div>
      <button class="form-submit" onclick="doRegister()">建立帳號</button>
    </div>
    <div class="form-msg" id="authMsg"></div>
  </div>
</div>

<!-- ── UPLOAD MODAL ── -->
<div class="modal-backdrop" id="uploadModal">
  <div class="modal">
    <button class="modal-close" onclick="closeModal('uploadModal')">✕</button>
    <div class="modal-title">上傳應援禮物</div>
    <div class="modal-sub">登入後免費分享給大家 🎁</div>

    <div class="form-group">
      <label class="form-label">禮物標題</label>
      <input class="form-input" type="text" id="giftTitle" placeholder="例：2025 豹紋手機壁紙"/>
    </div>
    <div class="form-group">
      <label class="form-label">類型</label>
      <select class="form-select" id="giftType">
        <option value="壁紙">壁紙/桌布</option>
        <option value="貼圖">貼圖包</option>
        <option value="影片">影片剪輯</option>
        <option value="卡片">卡片/圖卡</option>
        <option value="實體">實體周邊（拍照上傳）</option>
        <option value="其他">其他</option>
      </select>
    </div>
    <div class="form-group">
      <label class="form-label">IG 帳號（選填，方便大家認識你）</label>
      <input class="form-input" type="text" id="giftIg" placeholder="@your_ig_handle"/>
    </div>
    <div class="form-group">
      <label class="form-label">說明（選填）</label>
      <textarea class="form-textarea" id="giftDesc" placeholder="簡單介紹這個禮物…"></textarea>
    </div>
    <div class="form-group">
      <label class="form-label">封面圖片</label>
      <label class="form-file-area" id="fileArea">
        <input type="file" id="giftFile" accept="image/*" onchange="previewFile(this)"/>
        <div class="ffa-label">點擊選擇圖片</div>
        <div class="ffa-sub">JPG / PNG / WEBP · 最大 5MB</div>
      </label>
    </div>
    <div class="form-group">
      <label class="form-label">下載連結（選填，Cloudinary / Google Drive 等）</label>
      <input class="form-input" type="url" id="giftLink" placeholder="https://…"/>
    </div>
    <button class="form-submit" id="submitGiftBtn" onclick="submitGift()">送出禮物 ✦</button>
    <div class="form-msg" id="uploadMsg"></div>
  </div>
</div>

<footer>LSH · 豹 · 2010 – &nbsp;|&nbsp; © 2026 Made with 🩵 by <a href="about.html"
    style="color:var(--gold);text-decoration:none;opacity:0.8;">혁미 ·
    Taiwan Fan Archive · All Rights Reserved.</footer>

<script>
/* ── 狀態 ── */
let currentUser   = null;
let currentFilter = '全部';
let allGifts      = [];

const TYPE_CLASS = {
  壁紙:'type-wallpaper', 貼圖:'type-sticker',
  影片:'type-video',     卡片:'type-card',
  實體:'type-physical',  其他:'type-other'
};

/* ════ AUTH（靜態預覽版）════ */
function updateNavAuth() {
  const btn   = document.getElementById('navAuthBtn');
  const name  = document.getElementById('navUserName');
  const upBtn = document.getElementById('uploadBtn');
  if (currentUser) {
    name.textContent = currentUser.name;
    btn.textContent  = '登出';
    btn.className    = 'auth-btn';
    upBtn.classList.remove('disabled');
  } else {
    name.textContent = '';
    btn.textContent  = '登入';
    btn.className    = 'auth-btn primary';
    upBtn.classList.add('disabled');
  }
}

function handleAuthBtn() {
  if (currentUser) { currentUser = null; updateNavAuth(); }
  else openModal('authModal');
}

function switchAuthTab(tab, el) {
  document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('authLoginForm').style.display    = tab === 'login'    ? '' : 'none';
  document.getElementById('authRegisterForm').style.display = tab === 'register' ? '' : 'none';
  document.getElementById('authMsg').textContent = '';
}

function doLogin() {
  const email = document.getElementById('loginEmail').value.trim();
  const msg   = document.getElementById('authMsg');
  if (!email) { msg.className = 'form-msg err'; msg.textContent = '請輸入 Email'; return; }
  currentUser = { name: email.split('@')[0] };
  updateNavAuth();
  msg.className = 'form-msg ok'; msg.textContent = '登入成功！（預覽模式）';
  setTimeout(() => closeModal('authModal'), 900);
}

function doRegister() {
  const name  = document.getElementById('regName').value.trim();
  const email = document.getElementById('regEmail').value.trim();
  const msg   = document.getElementById('authMsg');
  if (!name || !email) { msg.className = 'form-msg err'; msg.textContent = '請填入所有欄位'; return; }
  currentUser = { name };
  updateNavAuth();
  msg.className = 'form-msg ok'; msg.textContent = '註冊成功！（預覽模式）';
  setTimeout(() => closeModal('authModal'), 900);
}

/* ════ GIFTS 資料 ════ */
/* 靜態預覽資料，接上 Supabase 後換成 loadGifts() */
const STATIC_GIFTS = [
  {
    id: 1,
    title: '2026 見面會 SVIP 吊牌',
    type: '實體',
    description: 'Eternal Man Tour 見面會 SVIP 限定吊牌，金色燙字設計。',
    image_url: 'assets/images/gift01.jpg',
    link_url: null,
    author_name: '爰爰',
    author_ig: null,
    created_at: '2026-05-01',
  },
  {
    id: 2,
    title: '2026 見面會 壓克力牌',
    type: '實體',
    description: '見面會限定壓克力立牌，豹豹插畫款。',
    image_url: 'assets/images/gift02.jpg',
    link_url: null,
    author_name: 'kumy',
    author_ig: null,
    created_at: '2026-05-01',
  },
  {
    id: 3,
    title: '2026 見面會 豹豹赫徽章',
    type: '實體',
    description: '手工豹豹赫閃光徽章，閃亮星星款。',
    image_url: 'assets/images/gift03.jpg',
    link_url: null,
    author_name: 'hyukmi',
    author_ig: null,
    created_at: '2026-05-01',
  },
  {
    id: 4,
    title: '2026 見面會 台灣飯T「I LOVE LEESOOHYUK」',
    type: '實體',
    description: '台灣粉絲應援T恤，I ♥ SOOHYUK 水鑽字款，附 Little Hyukmi 徽章。',
    image_url: 'assets/images/gift04.jpg',
    link_url: null,
    author_name: '台灣飯',
    author_ig: null,
    created_at: '2026-05-01',
  },
];

async function loadGifts() {
  allGifts = STATIC_GIFTS;
  renderGifts();
}

function setFilter(f, btn) {
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderGifts();
}

function renderGifts() {
  const grid = document.getElementById('giftsGrid');
  const list = currentFilter === '全部'
    ? allGifts
    : allGifts.filter(g => g.type === currentFilter);

  if (!list.length) {
    grid.innerHTML = `<div class="empty-state"><div class="es-icon">🎁</div><div>還沒有禮物，快來第一個上傳！</div></div>`;
    return;
  }

  grid.innerHTML = list.map(g => {
    const tc = TYPE_CLASS[g.type] || 'type-other';
    const dateStr = g.created_at ? g.created_at.slice(0,7) : '';
    const thumb = g.image_url
      ? `<img class="gift-thumb" src="${g.image_url}" alt="${g.title}" loading="lazy"/>`
      : `<div class="gift-thumb-placeholder">
           <svg width="36" height="36" viewBox="0 0 36 36" fill="none"><rect x="3" y="7" width="30" height="22" rx="3" stroke="#e2c97e" stroke-width="1.2"/><circle cx="18" cy="18" r="5" stroke="#e2c97e" stroke-width="1.2"/></svg>
           <span>NO IMAGE</span>
         </div>`;
    const linkBtn = g.link_url
      ? `<a href="${g.link_url}" target="_blank" rel="noopener" style="display:inline-block;margin-top:10px;font-size:11px;color:var(--gold);letter-spacing:0.1em;opacity:0.8;text-decoration:none;border-bottom:1px solid rgba(226,201,126,0.3);">查看 / 下載 →</a>`
      : '';
    return `
      <div class="gift-card">
        ${thumb}
        <div class="gift-info">
          <div class="gift-meta">
            <span class="gift-type-badge ${tc}">${g.type}</span>
            <span class="gift-date">${dateStr}</span>
          </div>
          <div class="gift-title">${g.title}</div>
          <div class="gift-author">
            ${g.author_ig
              ? `<a href="https://instagram.com/${g.author_ig.replace('@','')}" target="_blank" rel="noopener" style="color:var(--gold);text-decoration:none;opacity:0.8;">✦ ${g.author_name || '匿名'} <span style="font-size:9px;opacity:0.6;">@${g.author_ig.replace('@','')}</span></a>`
              : `✦ ${g.author_name || '匿名'}`
            }
          </div>
          ${g.description ? `<div class="gift-desc">${g.description}</div>` : ''}
          ${linkBtn}
        </div>
      </div>`;
  }).join('');
}

/* ════ UPLOAD ════ */
function openUploadModal() {
  if (!currentUser) { openModal('authModal'); return; }
  openModal('uploadModal');
}

function previewFile(input) {
  const file = input.files[0];
  if (!file) return;
  const area = document.getElementById('fileArea');
  const existing = area.querySelector('.ffa-preview');
  if (existing) existing.remove();
  const img = document.createElement('img');
  img.className = 'ffa-preview';
  img.src = URL.createObjectURL(file);
  area.appendChild(img);
}

async function submitGift() {
  if (!currentUser) return;
  const title = document.getElementById('giftTitle').value.trim();
  const type  = document.getElementById('giftType').value;
  const desc  = document.getElementById('giftDesc').value.trim();
  const link  = document.getElementById('giftLink').value.trim();
  const file  = document.getElementById('giftFile').files[0];
  const msg   = document.getElementById('uploadMsg');
  const btn   = document.getElementById('submitGiftBtn');

  if (!title) { msg.className = 'form-msg err'; msg.textContent = '請填入標題'; return; }

  btn.disabled = true;
  msg.className = 'form-msg'; msg.textContent = '上傳中…';

  let image_url = null;

  /* 上傳圖片到 Supabase Storage */
  if (file) {
    const ext  = file.name.split('.').pop();
    const path = `gifts/${Date.now()}_${Math.random().toString(36).slice(2)}.${ext}`;
    const { error: upErr } = await sb.storage.from('gift-images').upload(path, file);
    if (upErr) { msg.className = 'form-msg err'; msg.textContent = '圖片上傳失敗：' + upErr.message; btn.disabled = false; return; }
    const { data: urlData } = sb.storage.from('gift-images').getPublicUrl(path);
    image_url = urlData.publicUrl;
  }

  const display_name = currentUser.user_metadata?.display_name || currentUser.email;

  const { error } = await sb.from('gifts').insert({
    title,
    type,
    description: desc || null,
    link_url:    link || null,
    image_url,
    author_name: display_name,
    user_id:     currentUser.id,
  });

  if (error) {
    msg.className = 'form-msg err'; msg.textContent = '送出失敗：' + error.message;
    btn.disabled = false; return;
  }

  msg.className = 'form-msg ok'; msg.textContent = '✦ 禮物已上傳，謝謝你！';
  btn.disabled = false;

  /* 清空表單 */
  ['giftTitle','giftDesc','giftLink'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('giftFile').value = '';
  const prev = document.querySelector('.ffa-preview');
  if (prev) prev.remove();

  setTimeout(() => { closeModal('uploadModal'); loadGifts(); }, 1200);
}

/* ════ MODAL HELPERS ════ */
function openModal(id) { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }
document.querySelectorAll('.modal-backdrop').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) m.classList.remove('open'); });
});

/* ════ INIT ════ */
updateNavAuth();
loadGifts();

const i18n = {
  zh: {
    'page-title': '선물 · 應援禮物',
    'page-sub':   '粉絲免費應援禮物 · Fan Free Gifts',
  },
  en: {
    'page-title': '선물 · Fan Gifts',
    'page-sub':   'Free fan support gifts',
  },
  ko: {
    'page-title': '선물 · 應援禮物',
    'page-sub':   '팬 무료 서포트 선물',
  },
};

function setLang(lang) {
  const labels = { zh:'繁中', en:'EN', ko:'한국어' };
  document.getElementById('langLabel').textContent = labels[lang] || lang;
  const dict = Object.assign({}, i18n.zh, i18n[lang] || {});
  document.querySelectorAll('[data-i18n]').forEach(function(el) {
    const key = el.dataset.i18n;
    if (dict[key] !== undefined) el.innerHTML = dict[key];
  });
}
function toggleLangMenu() {
  document.getElementById('langMenu').classList.toggle('open');
}
document.addEventListener('click', function(e) {
  const dd = document.getElementById('langDropdown');
  if (dd && !dd.contains(e.target)) {
    document.getElementById('langMenu').classList.remove('open');
  }
});

</script>
</body>
</html>
