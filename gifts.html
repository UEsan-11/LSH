let currentUser   = null;

  壁紙:'type-wallpaper', 貼圖:'type-sticker',
  影片:'type-video',     卡片:'type-card',
  實體:'type-physical',  其他:'type-other'
};

/* ════ AUTH（靜態預覽版）════ */
function updateNavAuth() {
  const upBtn = document.getElementById('uploadBtn');
  if (!upBtn) return;
  if (currentUser) {
    upBtn.classList.remove('disabled');
  } else {
    upBtn.classList.add('disabled');
  }
}

function handleAuthBtn() {
  if (currentUser) { currentUser = null; updateNavAuth(); }
  else openModal('authModal');
}
/* 登入 icon 點擊 */
document.querySelector('.nav-icon-btn[aria-label="登入"]').addEventListener('click', function(e){
  e.preventDefault();
  if (currentUser) { currentUser = null; updateNavAuth(); }
  else openModal('authModal');
});

function switchAuthTab(tab, el) {
  document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('authLoginForm').style.display    = tab === 'login'    ? '' : 'none';
  document.getElementById('authRegisterForm').style.display = tab === 'register' ? '' : 'none';
  document.getElementById('authMsg').textContent = '';
}

function doLogin() {
  const email = document.getElementById('loginEmail').value.trim();
  const msg   = document.getElementById('authMsg');
  if (!email) { msg.className = 'form-msg err'; msg.textContent = '請輸入 Email'; return; }
  currentUser = { name: email.split('@')[0] };
  updateNavAuth();
  msg.className = 'form-msg ok'; msg.textContent = '登入成功！（預覽模式）';
  setTimeout(() => closeModal('authModal'), 900);
}

function doRegister() {
  const name  = document.getElementById('regName').value.trim();
  const email = document.getElementById('regEmail').value.trim();
  const msg   = document.getElementById('authMsg');
  if (!name || !email) { msg.className = 'form-msg err'; msg.textContent = '請填入所有欄位'; return; }
  currentUser = { name };
  updateNavAuth();
  msg.className = 'form-msg ok'; msg.textContent = '註冊成功！（預覽模式）';
  setTimeout(() => closeModal('authModal'), 900);
}

async function loadGifts() {
  allGifts = STATIC_GIFTS;
  renderGifts();
}

function setFilter(f, btn) {
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderGifts();
}

function renderGifts() {
  const grid = document.getElementById('giftsGrid');
  const list = currentFilter === '全部'
    ? allGifts
    : allGifts.filter(g => g.type === currentFilter);

  if (!list.length) {
    grid.innerHTML = `<div class="empty-state"><div class="es-icon">🎁</div><div>還沒有禮物，快來第一個上傳！</div></div>`;
    return;
  }

  grid.innerHTML = list.map(g => {
    const tc = TYPE_CLASS[g.type] || 'type-other';
    const dateStr = g.created_at ? g.created_at.slice(0,7) : '';
    const thumb = g.image_url
      ? `<img class="gift-thumb" src="${g.image_url}" alt="${g.title}" loading="lazy"/>`
      : `<div class="gift-thumb-placeholder">
           <svg width="36" height="36" viewBox="0 0 36 36" fill="none"><rect x="3" y="7" width="30" height="22" rx="3" stroke="#e2c97e" stroke-width="1.2"/><circle cx="18" cy="18" r="5" stroke="#e2c97e" stroke-width="1.2"/></svg>
           <span>NO IMAGE</span>
         </div>`;
    const linkBtn = g.link_url
      ? `<a href="${g.link_url}" target="_blank" rel="noopener" style="display:inline-block;margin-top:10px;font-size:11px;color:var(--gold);letter-spacing:0.1em;opacity:0.8;text-decoration:none;border-bottom:1px solid rgba(226,201,126,0.3);">查看 / 下載 →</a>`
      : '';
    return `
      <div class="gift-card">
        ${thumb}
        <div class="gift-info">
          <div class="gift-meta">
            <span class="gift-type-badge ${tc}">${g.type}</span>
            <span class="gift-date">${dateStr}</span>
          </div>
          <div class="gift-title">${g.title}</div>
          <div class="gift-author">
            ${g.author_ig
              ? `<a href="https://instagram.com/${g.author_ig.replace('@','')}" target="_blank" rel="noopener" style="color:var(--gold);text-decoration:none;opacity:0.8;">✦ ${g.author_name || '匿名'} <span style="font-size:9px;opacity:0.6;">@${g.author_ig.replace('@','')}</span></a>`
              : `✦ ${g.author_name || '匿名'}`
            }
          </div>
          ${g.description ? `<div class="gift-desc">${g.description}</div>` : ''}
          ${linkBtn}
        </div>
      </div>`;
  }).join('');
}

/* ════ UPLOAD ════ */
function openUploadModal() {
  if (!currentUser) { openModal('authModal'); return; }
  openModal('uploadModal');
}

function previewFile(input) {
  const file = input.files[0];
  if (!file) return;
  const area = document.getElementById('fileArea');
  const existing = area.querySelector('.ffa-preview');
  if (existing) existing.remove();
  const img = document.createElement('img');
  img.className = 'ffa-preview';
  img.src = URL.createObjectURL(file);
  area.appendChild(img);
}

async function submitGift() {
  if (!currentUser) return;
  const title = document.getElementById('giftTitle').value.trim();
  const type  = document.getElementById('giftType').value;
  const desc  = document.getElementById('giftDesc').value.trim();
  const link  = document.getElementById('giftLink').value.trim();
  const file  = document.getElementById('giftFile').files[0];
  const msg   = document.getElementById('uploadMsg');
  const btn   = document.getElementById('submitGiftBtn');

  if (!title) { msg.className = 'form-msg err'; msg.textContent = '請填入標題'; return; }

  btn.disabled = true;
  msg.className = 'form-msg'; msg.textContent = '上傳中…';

  let image_url = null;

  /* 上傳圖片到 Supabase Storage */
  if (file) {
    const ext  = file.name.split('.').pop();
    const path = `gifts/${Date.now()}_${Math.random().toString(36).slice(2)}.${ext}`;
    const { error: upErr } = await sb.storage.from('gift-images').upload(path, file);
    if (upErr) { msg.className = 'form-msg err'; msg.textContent = '圖片上傳失敗：' + upErr.message; btn.disabled = false; return; }
    const { data: urlData } = sb.storage.from('gift-images').getPublicUrl(path);
    image_url = urlData.publicUrl;
  }

  const display_name = currentUser.user_metadata?.display_name || currentUser.email;

  const { error } = await sb.from('gifts').insert({
    title,
    type,
    description: desc || null,
    link_url:    link || null,
    image_url,
    author_name: display_name,
    user_id:     currentUser.id,
  });

  if (error) {
    msg.className = 'form-msg err'; msg.textContent = '送出失敗：' + error.message;
    btn.disabled = false; return;
  }

  msg.className = 'form-msg ok'; msg.textContent = '✦ 禮物已上傳，謝謝你！';
  btn.disabled = false;

  /* 清空表單 */
  ['giftTitle','giftDesc','giftLink'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('giftFile').value = '';
  const prev = document.querySelector('.ffa-preview');
  if (prev) prev.remove();

  setTimeout(() => { closeModal('uploadModal'); loadGifts(); }, 1200);
}

/* ════ MODAL HELPERS ════ */
function openModal(id) { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }
document.querySelectorAll('.modal-backdrop').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) m.classList.remove('open'); });
});

updateNavAuth();
loadGifts();

function setLang(lang) {
  const labels = { zh:'繁中', en:'EN', ko:'한국어' };
  document.getElementById('langLabel').textContent = labels[lang] || lang;
  const dict = Object.assign({}, i18n.zh, i18n[lang] || {});
  document.querySelectorAll('[data-i18n]').forEach(function(el) {
    const key = el.dataset.i18n;
    if (dict[key] !== undefined) el.innerHTML = dict[key];
  });
}
function toggleLangMenu() {
  document.getElementById('langMenu').classList.toggle('open');
}
document.addEventListener('click', function(e) {
  const dd = document.getElementById('langDropdown');
  if (dd && !dd.contains(e.target)) {
    document.getElementById('langMenu').classList.remove('open');
  }
});
