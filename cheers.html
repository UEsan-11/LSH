const CATS = ['基本', '見面會', '生日', '日常'];
let currentFilter = '全部';

function setFilter(f, btn) {
  currentFilter = f;
  document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

function copyText(text, btn) {
  navigator.clipboard.writeText(text).then(() => {
    btn.textContent = '✓ 已複製';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.textContent = '複製韓文';
      btn.classList.remove('copied');
    }, 1800);
  });
}

function toggleCard(card) {
  card.classList.toggle('open');
}

function render() {
  const wrap = document.getElementById('cardsWrap');
  wrap.innerHTML = '';

  const filteredCats = currentFilter === '全部' ? CATS : [currentFilter];

  filteredCats.forEach(cat => {
    const items = cheers.filter(c => c.cat === cat);
    if (!items.length) return;

    const catLabel = { '基本':'基本應援', '見面會':'見面會現場用語', '生日':'生日應援', '日常':'日常對話' }[cat];

    const section = document.createElement('div');
    section.className = 'cat-section';

    const label = document.createElement('div');
    label.className = 'cat-label';
    label.textContent = catLabel;
    section.appendChild(label);

    const grid = document.createElement('div');
    grid.className = 'cards-grid';

    items.forEach(item => {
      const card = document.createElement('div');
      card.className = 'cheer-card';
      card.onclick = () => card.classList.toggle('open');

      card.innerHTML = `
        <div class="card-head">
          <div style="flex:1">
            <div class="card-ko">${item.ko}</div>
            <div class="card-rom">${item.rom}</div>
          </div>
          <div class="card-toggle">＋</div>
        </div>
        <div class="card-body">
          <div class="card-langs">
            <div class="lang-row">
              <span class="lang-tag">KO</span>
              <span class="lang-text ko">${item.ko}</span>
            </div>
            <div class="lang-row">
              <span class="lang-tag">繁中</span>
              <span class="lang-text">${item.langs.zh}</span>
            </div>
            <div class="lang-row">
              <span class="lang-tag">EN</span>
              <span class="lang-text">${item.langs.en}</span>
            </div>
            <div class="lang-row">
              <span class="lang-tag">日本語</span>
              <span class="lang-text">${item.langs.ja}</span>
            </div>
          </div>
          <div class="copy-row">
            <button class="copy-btn" onclick="event.stopPropagation(); copyText('${item.ko.replace(/'/g,"\\'")}', this)">複製韓文</button>
          </div>
        </div>`;

      grid.appendChild(card);
    });

    section.appendChild(grid);
    wrap.appendChild(section);
  });
}

render();

const i18n = {
  zh: {
    'page-title': '응원어 · 應援語',
    'page-sub':   '繁中 · EN · 한국어 · 日本語',
  },
  en: {
    'page-title': 'Fan Phrases · 응원어',
    'page-sub':   'Traditional Chinese · EN · Korean · Japanese',
  },
  ko: {
    'page-title': '응원어 · 應援語',
    'page-sub':   '번체 중국어 · EN · 한국어 · 일본어',
  },
};

function setLang(lang) {
  const labels = { zh:'繁中', en:'EN', ko:'한국어' };
  document.getElementById('langLabel').textContent = labels[lang] || lang;
  const dict = Object.assign({}, i18n.zh, i18n[lang] || {});
  document.querySelectorAll('[data-i18n]').forEach(function(el) {
    const key = el.dataset.i18n;
    if (dict[key] !== undefined) el.innerHTML = dict[key];
  });
}
function toggleLangMenu() {
  document.getElementById('langMenu').classList.toggle('open');
}
document.addEventListener('click', function(e) {
  const dd = document.getElementById('langDropdown');
  if (dd && !dd.contains(e.target)) {
    document.getElementById('langMenu').classList.remove('open');
  }
});


/* ── 回到頂部 ── */
window.addEventListener('scroll', function() {
  var btn = document.getElementById('backToTop');
  if (btn) btn.classList.toggle('visible', window.scrollY > 300);
});
</script>
